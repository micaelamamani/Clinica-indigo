<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/iconindigo.png" type="image/png">
    <title>Clínica Índigo | Historias Clínicas</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/estiloGeneral.css">
    <link rel="stylesheet" href="../estilos/estiloAdmin.css">
</head>

<body>
    <header class="navbar">
        <a href="inicioAdmin.html" class="logo">
            <div class="logo-name"><img src="../img/logoIndigo.png" alt=""></div>
        </a>
        <nav class="menu">
            <span class="menu-indicator"></span>
            <a href="inicioAdmin.html" class="menu-item"><i data-lucide="house"></i><span>Inicio</span></a>
            <a href="pacientes.html" class="menu-item"><i data-lucide="user-round"></i><span>Pacientes</span></a>
            <a href="turnos.html" class="menu-item"><i data-lucide="calendar-days"></i><span>Turnos médicos</span></a>
            <a href="historias.html" class="menu-item"><i data-lucide="clipboard-list"></i><span>Historias
                    clínicas</span></a>
            <a href="medicamentos.html" class="menu-item"><i data-lucide="pill"></i><span>Medicamentos</span></a>
            <a href="doctores.html" class="menu-item active">
                <i data-lucide="stethoscope"></i>
                <span>Doctores</span>
            </a>
            <a href="reportes.html" class="menu-item"><i data-lucide="info"></i><span>Reportes</span></a>
        </nav>
        <div class="admin">
            <div class="admin-icon"><i data-lucide="user-round"></i></div>
            <a id="user" href="../Cliente/inicioSesion.html">Admin</a>
        </div>
    </header>
    <main>
        <section class="welcome">

            <div class="header-seccion">
                <div>
                    <span class="small-title">
                        FICHA DEL DOCTOR
                    </span>

                    <h1 id="nombreDoctor">
                        Cargando...
                    </h1>

                    <p id="especialidadDoctor">
                        Especialidad: -
                    </p>
                </div>

                <button id="btnVolver" class="btn-primary" type="button">
                    Volver a doctores
                </button>
            </div>


            <section class="ficha-bloque">

                <div class="box-title">
                    <i data-lucide="user-round"></i>
                    <h2>Datos del doctor</h2>
                </div>

                <div class="historia-datos">

                    <div class="dato-historia">
                        <span>Nombre completo</span>
                        <strong id="nombreCompleto">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Género</span>
                        <strong id="genero">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Especialidad</span>
                        <strong id="especialidad">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Matrícula</span>
                        <strong id="matricula">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Teléfono</span>
                        <strong id="telefono">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Correo</span>
                        <strong id="correo">-</strong>
                    </div>

                    <div class="dato-historia">
                        <span>Usuario</span>
                        <strong id="usuario">-</strong>
                    </div>

                </div>

            </section>

        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script src="../indicadorMenu.js"></script>
    <script src="../js/fichaDoctor.js"></script>
</body>

</html>
