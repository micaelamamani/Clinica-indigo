<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/iconindigo.png" type="image/png">
    <title>Clínica Índigo | Historia Clínica</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/estiloGeneral.css">
    <link rel="stylesheet" href="../estilos/estiloAdmin.css">
</head>
<body>
    <header class="navbar">
        <a href="inicioAdmin.html" class="logo">
            <div class="logo-name">
                <img src="../img/logoIndigo.png" alt="Clínica Índigo">
            </div>
        </a>
        <nav class="menu">
            <span class="menu-indicator"></span>
            <a href="inicioAdmin.html" class="menu-item">
                <i data-lucide="house"></i>
                <span>Inicio</span>
            </a>
            <a href="pacientes.html" class="menu-item">
                <i data-lucide="user-round"></i>
                <span>Pacientes</span>
            </a>
            <a href="turnos.html" class="menu-item">
                <i data-lucide="calendar-days"></i>
                <span>Turnos médicos</span>
            </a>
            <a href="historias.html" class="menu-item active">
                <i data-lucide="clipboard-list"></i>
                <span>Historias clínicas</span>
            </a>
            <a href="medicamentos.html" class="menu-item">
                <i data-lucide="pill"></i>
                <span>Medicamentos</span>
            </a>
            <a href="reportes.html" class="menu-item">
                <i data-lucide="info"></i>
                <span>Reportes</span>
            </a>
        </nav>
        <div class="admin">
            <div class="admin-icon">
                <i data-lucide="user-round"></i>
            </div>
            <a id="user" href="../Cliente/inicioSesion.html">
                Admin
            </a>
        </div>
    </header>
    <main>
        <section class="admin-section">
            <div class="header-seccion">
                <div>
                    <span class="small-title">
                        HISTORIA CLÍNICA
                    </span>
                    <h1 id="nombrePaciente">
                        Cargando...
                    </h1>
                    <p id="dniPaciente">
                        DNI: -
                    </p>
                </div>
            </div>
            <!-- DATOS DEL PACIENTE -->
            <section class="historia-datos">
                <div class="dato-historia">
                    <span>
                        Paciente
                    </span>
                    <strong id="nombreCompleto">
                        -
                    </strong>
                </div>
                <div class="dato-historia">
                    <span>
                        DNI
                    </span>
                    <strong id="dni">
                        -
                    </strong>
                </div>
                <div class="dato-historia">
                    <span>
                        Fecha de nacimiento
                    </span>
                    <strong id="fechaNacimiento">
                        -
                    </strong>
                </div>
                <div class="dato-historia">
                    <span>
                        Ciudad
                    </span>
                    <strong id="ciudad">
                        -
                    </strong>
                </div>
            </section>
            <!-- CONSULTAS -->
            <section class="historia-consultas">
                <div class="box-title">
                    <i data-lucide="clipboard-list"></i>
                    <h2>
                        Consultas médicas
                    </h2>
                </div>
                <div id="contenedorConsultas" class="consultas-lista">
                    <p class="text-center">
                        Cargando consultas...
                    </p>
                </div>
            </section>
        </section>
    </main>
    <script src="../js/historialClinicoAdmin.js"></script>
    <script src="../indicadorMenu.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
