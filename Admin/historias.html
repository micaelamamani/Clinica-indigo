<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/iconindigo.png" type="image/png">
    <title>Clínica Índigo | Historias Clínicas</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/estiloGeneral.css">
    <link rel="stylesheet" href="../estilos/estiloAdmin.css">
</head>

<body>
    <header class="navbar">
        <a href="inicioAdmin.html" class="logo">
            <div class="logo-name"><img src="../img/logoIndigo.png" alt=""></div>
        </a>
        <nav class="menu">
            <span class="menu-indicator"></span>
            <a href="inicioAdmin.html" class="menu-item"><i data-lucide="house"></i><span>Inicio</span></a>
            <a href="pacientes.html" class="menu-item"><i data-lucide="user-round"></i><span>Pacientes</span></a>
            <a href="turnos.html" class="menu-item"><i data-lucide="calendar-days"></i><span>Turnos médicos</span></a>
            <a href="historias.html" class="menu-item active"><i data-lucide="clipboard-list"></i><span>Historias
                    clínicas</span></a>
            <a href="medicamentos.html" class="menu-item"><i data-lucide="pill"></i><span>Medicamentos</span></a>
            <a href="doctores.html" class="menu-item">
                <i data-lucide="stethoscope"></i>
                <span>Doctores</span>
            </a>
            <a href="reportes.html" class="menu-item"><i data-lucide="info"></i><span>Reportes</span></a>
        </nav>
        <div class="admin">
            <div class="admin-icon"><i data-lucide="user-round"></i></div>
            <a id="user" href="../Cliente/inicioSesion.html">Admin</a>
        </div>
    </header>

    <main>
        <section class="admin-section">
            <div class="header-seccion">
                <h1>Historias clínicas</h1>
                <div class="acciones-top busqueda-historias">

                    <div class="campo-busqueda">
                        <i data-lucide="user"></i>
                        <input type="text" id="buscarApellido" placeholder="Buscar por apellido...">
                    </div>

                    <div class="campo-busqueda">
                        <i data-lucide="id-card"></i>
                        <input type="text" id="buscarDni" placeholder="Buscar por DNI...">
                    </div>

                    <button class="btn-principal" id="btnBuscar">
                        <i data-lucide="search"></i>
                    </button>

                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paciente</th>
                            <th>Última actualización</th>
                            <th>Médico responsable</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorias">
                        <tr>
                            <td colspan="5" class="text-center">No hay registros clínicos cargados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>lucide.createIcons();</script>
    <script src="../indicadorMenu.js"></script>
    <script src="../js/historiasAdmin.js"></script>
</body>

</html>
