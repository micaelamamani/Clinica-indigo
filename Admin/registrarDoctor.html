<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/iconindigo.png" type="image/png">
    <title>Registrar médico | Clínica Índigo</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/inicioSesion.css">
    <link rel="stylesheet" href="../estilos/inicioPaciente.css">
</head>
<body>
    <div class="top-info">
        <span>
            <i data-lucide="clock"></i>
            Lunes a viernes 08:00 - 18:00
        </span>
        <span class="separador">|</span>
        <span>
            Sábados 08:00 - 13:00
        </span>
        <span>
            <i data-lucide="phone"></i>
            11 4567 8900
        </span>
        <span>
            <i data-lucide="mail"></i>
            info@clinicaindigo.com.ar
        </span>
        <span>
            <i data-lucide="map-pin"></i>
            Av. Mitre 1234, Buenos Aires
        </span>
    </div>
    <main class="registro-main">
        <section class="login-card registro-card">
            <div class="login-overlay"></div>
            <div class="login-content registro-content">
                <h1>Registrar médico</h1>
                <form id="doctorForm">
                    <!-- NOMBRE Y APELLIDO -->
                    <div class="registro-row">
                        <div class="login-field">
                            <label for="nombre">
                                Nombre
                            </label>
                            <div class="input-container">
                                <i data-lucide="user-round"></i>
                                <input type="text" id="nombre" name="nombre" required>
                            </div>
                        </div>
                        <div class="login-field">
                            <label for="apellido">
                                Apellido
                            </label>
                            <div class="input-container">
                                <i data-lucide="user-round"></i>
                                <input type="text" id="apellido" name="apellido" required>
                            </div>
                        </div>
                    </div>
                    <!-- ESPECIALIDAD Y MATRÍCULA -->
                    <div class="registro-row">
                        <div class="login-field">
                            <label for="especialidad">
                                Especialidad
                            </label>
                            <div class="input-container">
                                <i data-lucide="stethoscope"></i>
                                <input type="text" id="especialidad" name="especialidad" required>
                            </div>
                        </div>
                        <div class="login-field">
                            <label for="matricula">
                                Matrícula
                            </label>
                            <div class="input-container">
                                <i data-lucide="badge-check"></i>
                                <input type="text" id="matricula" name="matricula" required>
                            </div>
                        </div>
                    </div>
                    <!-- USUARIO -->
                    <div class="login-field">
                        <label for="usuario">
                            Usuario
                        </label>
                        <div class="input-container">
                            <i data-lucide="user-round"></i>
                            <input type="text" id="usuario" name="usuario" required>
                        </div>
                    </div>
                    <!-- CONTRASEÑA -->
                    <div class="login-field">
                        <label for="password">
                            Contraseña
                        </label>
                        <div class="input-container">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </div>
                    <button
                        type="submit"
                        class="btn-login">
                        Registrar médico
                    </button>
                </form>
                <div class="register">
                    <a href="inicioAdmin.html">
                        Volver al administrador
                    </a>
                </div>
            </div>
        </section>
    </main>
    <script src="../js/registrarDoctor.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
