<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/iconindigo.png" type="image/png">
    <title>Clínica Índigo | Pacientes</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../estilos/estiloGeneral.css">
    <link rel="stylesheet" href="../estilos/estiloAdmin.css">
</head>
<body>
    <!-- MENÚ SUPERIOR (Igual a inicioAdmin) -->
    <header class="navbar">
        <a href="inicioAdmin.html" class="logo">
            <div class="logo-name"><img src="../img/logoIndigo.png" alt=""></div>
        </a>
        <nav class="menu">
            <span class="menu-indicator"></span>
            <a href="inicioAdmin.html" class="menu-item"><i data-lucide="house"></i><span>Inicio</span></a>
            <a href="pacientes.html" class="menu-item active"><i data-lucide="user-round"></i><span>Pacientes</span></a>
            <a href="turnos.html" class="menu-item"><i data-lucide="calendar-days"></i><span>Turnos médicos</span></a>
            <a href="historias.html" class="menu-item"><i data-lucide="clipboard-list"></i><span>Historias clínicas</span></a>
            <a href="medicamentos.html" class="menu-item"><i data-lucide="pill"></i><span>Medicamentos</span></a>
            <a href="reportes.html" class="menu-item"><i data-lucide="info"></i><span>Reportes</span></a>
        </nav>
        <div class="admin">
            <div class="admin-icon"><i data-lucide="user-round"></i></div>
            <a id="user" href="../Cliente/inicioSesion.html">Admin</a>
        </div>
    </header>

    <main>
        <section class="welcome">
            <div class="header-seccion">
                <h1>Pacientes</h1>
                <div class="acciones-top">
                    <input type="text" class="search-input" placeholder="Buscar paciente...">
                    <button class="btn-primary"><i data-lucide="plus"></i> Nuevo paciente</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>DNI</th>
                            <th>Fecha de nacimiento</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPacientes">
                        <!-- Fila vacía para rellenar con la base de datos -->
                        <tr>
                            <td colspan="6" class="text-center">No hay pacientes registrados de forma activa.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>lucide.createIcons();</script>
    <script src="../indicadorMenu.js"></script>
    <script src="../js/pacientes.js"></script>
</body>
</html>
