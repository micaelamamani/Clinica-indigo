<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/iconindigo.png" type="image/png">
    <title>ClínicaAAA</title>

    <!-- Íconos Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="estilos/estiloGeneral.css">
</head>

<body>

    <!-- MENÚ -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <div class="logo-name">
                <img src="img/logoIndigo.png" alt="">
            </div>
        </a>

        <nav class="menu">

            <span class="menu-indicator"></span>

            <a href="#" class="menu-item active">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-user"></i>
                <span>Pacientes</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Turnos médicos</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>Historias clínicas</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-pills"></i>
                <span>Medicamentos</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-circle-info"></i>
                <span>Reportes</span>
            </a>

        </nav>

        <div class="admin">

            <div class="admin-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <span>Admin</span>

        </div>

    </header>


    <main>

        <!-- BIENVENIDA -->
        <section class="welcome">

            <div class="pattern"></div>

            <h1>¡Bienvenido, Administrador!</h1>

            <div class="resumen">

                <h2>Resumen general</h2>

                <div class="summary">

                    <!-- PACIENTES -->
                    <div class="summary-card">

                        <div class="summary-icon patients">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <div>
                            <span class="number">0</span>

                            <p>
                                pacientes<br>
                                registrados
                            </p>
                        </div>

                    </div>


                    <!-- TURNOS -->
                    <div class="summary-card">

                        <div class="summary-icon appointments">
                            <i class="fa-solid fa-calendar-days"></i>
                        </div>

                        <div>
                            <span class="number">0</span>

                            <p>
                                Turnos para<br>
                                hoy
                            </p>
                        </div>

                    </div>


                    <!-- CONSULTAS -->
                    <div class="summary-card">

                        <div class="summary-icon consultations">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>

                        <div>
                            <span class="number">0</span>

                            <p>
                                Consultas<br>
                                realizadas hoy
                            </p>
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- PARTE INFERIOR -->
        <section class="bottom">

            <!-- PRÓXIMOS TURNOS -->
            <div class="box">

                <div class="box-title">
                    <i class="fa-solid fa-calendar-days"></i>
                    <h2>Próximos turnos</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Estado</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td colspan="5">
                                    Vacío
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- RECORDATORIOS -->
            <div class="box reminders">

                <div class="box-title">
                    <i class="fa-solid fa-bell"></i>
                    <h2>Recordatorios</h2>
                </div>

                <div class="empty">

                    <!--span class="empty-icon">♧</span-->

                    <p>Vacío</p>

                </div>

            </div>

        </section>

    </main>


    

</body>
</html>
